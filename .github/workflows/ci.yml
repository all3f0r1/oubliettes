name: CI

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:

jobs:
  # Tests, Lint and an unsigned release build (R8 included). No secret in sight.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: ./gradlew testDebugUnitTest lintDebug assembleRelease
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  # Signs and publishes, for tags only and once the checks pass.
  release:
    if: github.ref_type == 'tag'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: echo "$KEYSTORE_BASE64" | base64 -d > release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - run: ./gradlew assembleRelease
        env:
          ORG_GRADLE_PROJECT_keystorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
      - run: |
          cp app/build/outputs/apk/release/app-release.apk "oubliettes-$GITHUB_REF_NAME.apk"
          # Release notes are this version's section of the changelog.
          awk -v heading="## $GITHUB_REF_NAME" '$0 == heading { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "oubliettes-$GITHUB_REF_NAME.apk" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
