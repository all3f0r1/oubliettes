name: CI

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: ./gradlew testDebugUnitTest assembleDebug
      # ponytail: debug APK, signed with a throwaway per-run key, so each release must be
      # installed over an uninstall. Switch to assembleRelease + keystore secrets for updates.
      - run: cp app/build/outputs/apk/debug/app-debug.apk "oubliettes-$GITHUB_REF_NAME.apk"
        if: github.ref_type == 'tag'
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - run: gh release create "$GITHUB_REF_NAME" "oubliettes-$GITHUB_REF_NAME.apk" --generate-notes
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
