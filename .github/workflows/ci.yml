name: CI

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Without the secrets (fork pull requests) the release APK is built unsigned.
      - run: echo "$KEYSTORE_BASE64" | base64 -d > release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - run: ./gradlew testDebugUnitTest assembleRelease
        env:
          ORG_GRADLE_PROJECT_keystorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk
      - if: github.ref_type == 'tag'
        run: |
          cp app/build/outputs/apk/release/app-release.apk "oubliettes-$GITHUB_REF_NAME.apk"
          # Release notes are this version's section of the changelog.
          awk -v heading="## $GITHUB_REF_NAME" '$0 == heading { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "oubliettes-$GITHUB_REF_NAME.apk" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
